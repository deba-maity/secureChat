services:
  postgres:
    image: postgres:16-alpine
    container_name: secure-chat-postgres
    environment:
      POSTGRES_DB: securechat
      POSTGRES_USER: securechat
      POSTGRES_PASSWORD: securechat
    ports:
      - "5432:5432"
    volumes:
      - secure-chat-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securechat -d securechat"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  secure-chat-data:

